[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-flasher-ui"
version = "0.1.0"
description = "Unified firmware flashing, device serial control, and cross-device coordination for ESP32, Flipper Zero, and Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "LxveAce"},
]
keywords = ["esp32", "flasher", "serial", "marauder", "flipper", "firmware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt5>=5.15.0",
    "pyserial>=3.5",
    "esptool>=4.7,<5",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/LxveAce/universal-flasher-ui"
Repository = "https://github.com/LxveAce/universal-flasher-ui"
Issues = "https://github.com/LxveAce/universal-flasher-ui/issues"

[project.scripts]
universal-flasher-ui = "src.main:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
