name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python build.py --onefile

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Rename artifact
        shell: bash
        run: mv dist/universal-flasher-ui.exe "dist/universal-flasher-ui-${{ steps.tag.outputs.TAG }}-windows-x64.exe"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/universal-flasher-ui-${{ steps.tag.outputs.TAG }}-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-flasher-ui-windows-x64
          path: dist/universal-flasher-ui-${{ steps.tag.outputs.TAG }}-windows-x64.exe

  build-macos:
